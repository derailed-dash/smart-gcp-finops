name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ==========================================================================
    # MANUAL PRODUCTION DEPLOYMENT
    # ==========================================================================
    # This workflow is decouple from the staging push. To deploy to production:
    #
    # 1. Go to the 'Actions' tab in GitHub.
    # 2. Select 'Deploy to Production' from the left sidebar.
    # 3. Click 'Run workflow' > 'Run workflow'.
    # ==========================================================================
    concurrency: production
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          project_id: ${{ vars.CICD_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: Install uv and google-agents-cli
        run: |
          pip install uv
          uv pip install google-agents-cli --system

      - name: Export requirements for Agent Runtime
        run: |
          uv pip compile agent/pyproject.toml -o agent/finops_agent/requirements.txt

      - name: Deploy to Agent Runtime (Production)
        run: |
          cd agent && uvx google-agents-cli deploy \
            --deployment-target agent_runtime \
            --no-confirm-project \
            --project ${{ vars.PROD_PROJECT_ID }} \
            --region ${{ vars.REGION }} \
            --service-account ${{ vars.APP_SERVICE_ACCOUNT_PROD }} \
            --service-name ${{ vars.CONTAINER_NAME }}-backend \
            --min-instances ${{ vars.AGENT_RUNTIME_PROD_MIN_INSTANCES }} \
            --max-instances ${{ vars.AGENT_RUNTIME_PROD_MAX_INSTANCES }} \
            --update-env-vars GOOGLE_CLOUD_REGION=${{ vars.REGION }},GOOGLE_CLOUD_LOCATION=${{ vars.GOOGLE_CLOUD_LOCATION }},GOOGLE_CLOUD_BILLING_ACCOUNT=${{ vars.GOOGLE_CLOUD_BILLING_ACCOUNT }},GOOGLE_CLOUD_BILLING_LOCATION=${{ vars.GOOGLE_CLOUD_BILLING_LOCATION }},GOOGLE_CLOUD_BILLING_PROJECT=${{ vars.GOOGLE_CLOUD_BILLING_PROJECT }},BILLING_EXPORT_DATASET=${{ vars.BILLING_EXPORT_DATASET }},GOOGLE_GENAI_USE_VERTEXAI=${{ vars.GOOGLE_GENAI_USE_VERTEXAI }},MODEL=${{ vars.MODEL }},FAST_MODEL=${{ vars.FAST_MODEL }},GOOGLE_CLOUD_ORGANIZATION=${{ vars.GOOGLE_CLOUD_ORGANIZATION }},LOGS_BUCKET_NAME=${{ vars.LOGS_BUCKET_NAME_PROD }},OTEL_TO_CLOUD=true,LOG_LEVEL=INFO,GOOGLE_CLOUD_AGENT_ENGINE_ENABLE_TELEMETRY=true,OTEL_SEMCONV_STABILITY_OPT_IN=gen_ai_latest_experimental,OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=EVENT_ONLY

      - name: Extract Agent Runtime ID
        run: |
          if [ -f agent/deployment_metadata.json ]; then
            AGENT_RUNTIME_ID=$(jq -r '.remote_agent_runtime_id' agent/deployment_metadata.json)
            echo "AGENT_RUNTIME_ID=$AGENT_RUNTIME_ID" >> $GITHUB_ENV
            echo "Extracted Agent Runtime ID: $AGENT_RUNTIME_ID"
          else
            echo "agent/deployment_metadata.json not found!"
            exit 1
          fi

      - name: Deploy to Production (Cloud Run BFF)
        run: |
          gcloud run deploy smart-gcp-finops \
            --image ${{ vars.REGION }}-docker.pkg.dev/${{ vars.CICD_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/${{ vars.CONTAINER_NAME }} \
            --region ${{ vars.REGION }} \
            --project ${{ vars.PROD_PROJECT_ID }} \
            --service-account ${{ vars.APP_SERVICE_ACCOUNT_PROD }} \
            --max-instances ${{ vars.CLOUD_RUN_PROD_MAX_INSTANCES }} \
            --min-instances ${{ vars.CLOUD_RUN_PROD_MIN_INSTANCES }} \
            --cpu-boost \
            --no-allow-unauthenticated \
            --update-env-vars GOOGLE_CLOUD_PROJECT=${{ vars.PROD_PROJECT_ID }},GOOGLE_CLOUD_REGION=${{ vars.REGION }},GOOGLE_CLOUD_LOCATION=${{ vars.GOOGLE_CLOUD_LOCATION }},GOOGLE_GENAI_USE_VERTEXAI=${{ vars.GOOGLE_GENAI_USE_VERTEXAI }},MODEL=${{ vars.MODEL }},FAST_MODEL=${{ vars.FAST_MODEL }},GOOGLE_CLOUD_ORGANIZATION=${{ vars.GOOGLE_CLOUD_ORGANIZATION }},LOGS_BUCKET_NAME=${{ vars.LOGS_BUCKET_NAME_PROD }},GOOGLE_CLOUD_BILLING_ACCOUNT=${{ vars.GOOGLE_CLOUD_BILLING_ACCOUNT }},GOOGLE_CLOUD_BILLING_LOCATION=${{ vars.GOOGLE_CLOUD_BILLING_LOCATION }},GOOGLE_CLOUD_BILLING_PROJECT=${{ vars.GOOGLE_CLOUD_BILLING_PROJECT }},BILLING_EXPORT_DATASET=${{ vars.BILLING_EXPORT_DATASET }},COMMIT_SHA=${{ github.sha }},LOG_LEVEL=INFO,AGENT_RUNTIME_ID=${{ env.AGENT_RUNTIME_ID }} \
            --iap


