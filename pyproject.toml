# Description: Root pyproject.toml configuration.
# Scope: Governs the BFF (Backend-for-Frontend) web container, including FastAPI, Uvicorn, and client SDKs.
# Build Target: Multi-stage Dockerfile compiling React UI assets and serving them via FastAPI BFF on Cloud Run.

[project]
name = "smart-gcp-finops"
version = "0.1.1"
description = ""
authors = [{ name = "Darren 'Dazbo' Lester", email = "real.dazbo@gmail.com" }]
dependencies = [
    "google-adk[a2a]>=2.3.0,<3.0.0",
    "mcp>=1.28.0",
    "google-api-python-client>=2.198.0",
    "google-cloud-dataplex>=2.20.0,<3.0.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.26.0,<2.0.0",
    "opentelemetry-exporter-gcp-logging>=0.38b0",
    "opentelemetry-exporter-gcp-monitoring>=0.38b0",
    "opentelemetry-resourcedetector-gcp>=1.5.0",
    "gcsfs>=2026.5.0",
    "google-cloud-logging>=3.16.0,<4.0.0",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.159.0",
    "fastapi>=0.136.0,<1.0.0",
    "uvicorn>=0.48.0,<1.0.0",
    "asyncpg>=0.31.0,<1.0.0",
    "slowapi>=0.1.9,<1.0.0",
]
requires-python = ">=3.12,<3.14"


[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=0.23.8,<2.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
jupyter = ["jupyter>=1.0.0,<2.0.0"]
eval = ["google-adk[eval]>=2.1.0,<3.0.0"]
lint = ["ruff>=0.4.6,<1.0.0", "ty>=0.0.1a0", "codespell>=2.2.0,<3.0.0"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "notebooks/**",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"] # ignore line too long, too complex

[tool.ruff.lint.isort]
known-first-party = ["app", "frontend"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = [".venv/**", "notebooks/**", "tests/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/*.ipynb,**/package-lock.json"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = [".", "app"]
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["app/finops_agent", "frontend"]
